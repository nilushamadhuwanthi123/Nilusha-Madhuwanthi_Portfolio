<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Lost in the Niluverse</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2310120F'/%3E%3Ctext x='50%25' y='58%25' font-size='52' text-anchor='middle' fill='%23C9A85C' font-family='monospace'%3EN%3C/text%3E%3C/svg%3E">
<style>
  :root{ --bg:#10120F; --card:#191C16; --ivory:#F4F1E8; --silver:#C4C7C2; --gold:#C9A85C; --gold-bright:#E0C477; --border:#30352A; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    background:var(--bg); color:var(--ivory);
    font-family:'Inter', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background-image: radial-gradient(circle at 20% 20%, rgba(201,168,92,.06), transparent 45%), radial-gradient(circle at 80% 80%, rgba(137,148,102,.08), transparent 45%);
  }
  .code{
    font-family:'Space Grotesk', monospace;
    font-size:clamp(3.5rem, 12vw, 7rem);
    font-weight:700;
    color:var(--gold-bright);
    letter-spacing:.02em;
    line-height:1;
    text-shadow:0 0 40px rgba(224,196,119,.35);
  }
  h1{ font-family:'Space Grotesk', monospace; font-size:1.3rem; margin:14px 0 8px; }
  p{ color:var(--silver); max-width:420px; margin:0 auto 28px; line-height:1.6; }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 26px;
    border-radius:999px;
    border:1px solid var(--gold);
    color:var(--bg);
    background:var(--gold);
    font-family:'Space Grotesk', monospace;
    font-size:.9rem;
    text-decoration:none;
    transition:all .2s ease;
  }
  .btn:hover{ background:var(--gold-bright); border-color:var(--gold-bright); }
  .orbit{
    width:64px; height:64px;
    border-radius:50%;
    border:1px dashed rgba(201,168,92,.4);
    margin:0 auto 26px;
    position:relative;
    animation:spin 12s linear infinite;
  }
  .orbit::before{
    content:'';
    position:absolute; top:-4px; left:50%;
    width:8px; height:8px; margin-left:-4px;
    border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 12px rgba(224,196,119,.7);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .orbit{ animation:none; } }
</style>
</head>
<body>
  <div>
    <div class="orbit" aria-hidden="true"></div>
    <div class="code">404</div>
    <h1>This corner of the Niluverse doesn't exist.</h1>
    <p>The page you're looking for was never built, or it drifted out of orbit. Let's get you back to solid ground.</p>
    <a class="btn" href="/">← Back to NILUVERSE</a>
  </div>
</body>
</html>
